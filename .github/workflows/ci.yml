name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            portal-web/package-lock.json
            admin-web/package-lock.json
      - name: 学员端
        working-directory: portal-web
        run: |
          npm ci
          npm run build
      - name: 管理端
        working-directory: admin-web
        run: |
          npm ci
          npm run build
