# ============================================================
# 云枢智学 · 后端公共配置
# 环境差异见 application-dev.yml / application-prod.yml
# 密钥与连接信息一律走环境变量（02 §2.4），不得写入代码或数据库
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Nginx 反向代理下获取真实客户端 IP（操作日志、接口频控）
  forward-headers-strategy: framework

spring:
  application:
    name: yunshu-zhixue
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yszx}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:yszx}
    password: ${MYSQL_PASSWORD:yszx_2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: yszx-hikari

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:yszx_redis_2026}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 全站逻辑删除（D14）；operation_log / role_permission 为例外，实体不继承 BaseEntity
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  # 双端独立 JWT 令牌域（D7）；secret 至少 32 字符（HS256）
  jwt:
    portal:
      secret: ${JWT_PORTAL_SECRET:portal-dev-secret-change-me-0123456789abcdef}
      access-ttl: 2h
      refresh-ttl: 14d
    admin:
      secret: ${JWT_ADMIN_SECRET:admin-dev-secret-change-me-0123456789abcdef}
      access-ttl: 2h
      refresh-ttl: 14d
  # 对象存储（S3 兼容，D8）
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:yszxadmin}
    secret-key: ${MINIO_SECRET_KEY:yszx_minio_2026}
    bucket: ${MINIO_BUCKET:yszx-media}
    public-url: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}
  # 后台用户重置密码的默认值（D4-10 Q9，不落 system_setting）
  default-password: ${APP_DEFAULT_PASSWORD:Yszx@123456}

logging:
  level:
    root: INFO
    com.yunshu.zhixue: DEBUG
