# ============================================================
# 云枢智学 · HTTPS 覆盖配置
#
# 用法（与生产编排叠加）：
#   docker compose -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.https.yml up -d --build
#
# 前置：
#   - deploy/certs/fullchain.pem（证书链）
#   - deploy/certs/privkey.pem（私钥）
#   - 如证书放在其他目录，设置 TLS_CERT_DIR=/path/to/certs
#
# 说明：
#   - 基础编排仍将 WEB_PORT（默认 8088）映射到容器 80，用于 301 跳转；
#   - 本覆盖暴露 443（WEB_HTTPS_PORT 可改），并替换 Nginx 配置；
#   - 使用云负载均衡 / SLB 做 TLS 终止时不要叠加本文件。
# ============================================================

services:
  web:
    ports:
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ >/dev/null || exit 1"]
