# ============================================================
# 云枢智学 · Nginx HTTPS 配置（生产可选）
#
# 启用方式：
#   1. 将证书放到 deploy/certs/fullchain.pem 与 deploy/certs/privkey.pem；
#   2. docker compose -f deploy/docker-compose.prod.yml \
#        -f deploy/docker-compose.https.yml up -d --build
#
# 说明：
#   - 80 端口仅做 301 跳转；
#   - 证书路径固定为容器内 /etc/nginx/certs/，由 compose 挂载；
#   - 如使用云负载均衡 / SLB 做 TLS 终止，继续使用 deploy/nginx.conf 即可。
# ============================================================

server {
    listen 80;
    server_name _;

    # 保留 ACME HTTP-01 校验路径（如使用 Let's Encrypt webroot 模式）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API（含 SSE：关闭缓冲，放宽读超时）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 对象存储公开文件（MINIO_PUBLIC_URL=/files）
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 管理端静态资源与 SPA 回退
    location /admin/assets/ {
        expires 30d;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 学员端静态资源与 SPA 回退
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
